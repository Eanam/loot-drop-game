services:
  - type: web
    name: startup-graveyard
    runtime: docker
    plan: free
    # 新加坡对国内访问更友好；如果免费层提示该区域不可用，改成 oregon
    region: singapore
    healthCheckPath: /api/health
    envVars:
      # 安全：key 只存在于 Render 环境变量，不进仓库
      - key: LLM_API_KEY
        sync: false # 部署时 Render 会提示你在面板里填值
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
